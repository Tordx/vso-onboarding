<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HAPPYLUCK</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Description">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="vue.css">
  <style>
    a {
      color: #FAD439
    }
    span {
      color: #FAD439
    }
    h1 {
      color: #FAD439
    }
    body.light-mode {
      background-color: #25293C;
      color: #fff;
    }
    body.dark-mode {
      background-color: #25293C;
      color: #ffffff;
    }
    body.dark-mode .markdown-section a {
      color: #FAD439;
    }
    body.dark-mode .anchor span {
    color: #FAD439;
    }
    body.dark-mode .markdown-section h1, .markdown-section h2, .markdown-section h3, .markdown-section h4, .markdown-section strong {
    color: #FAD439;
    font-weight: 600;
    }
    body.dark-mode .markdown-section code {
    border-radius: 2px;
    color: #fff;
    margin: 0 2px;
    padding: 3px 5px;
    white-space: pre-wrap;
    } 

    body.dark-mode .markdown-section code, .markdown-section pre {
    background-color: #111111;
    border-radius: 10px;
    }
    body.light-mode .markdown-section code, .markdown-section pre {
    background-color: #111;
    border-radius: 10px;
    }
    body.dark-mode .markdown-section pre>code {
        color: #fff;
        font-size: .8rem;
        padding: 0px;
        padding-top: 15px;
        padding-bottom: 20px;
        line-height: inherit;
        margin: 0 2px;
        max-width: inherit;
        overflow: inherit;
        white-space: inherit;
    }
    body.light-mode .markdown-section pre>code {
        color: #fff;
        font-size: .8rem;
        padding: 0px;
        padding-top: 15px;
        padding-bottom: 20px;
        line-height: inherit;
        margin: 0 2px;
        max-width: inherit;
        overflow: inherit;
        white-space: inherit;
    }
    .markdown-section code {
    border-radius: 2px;
    color: #fff;
    margin: 0 2px;
    padding: 3px 5px;
    white-space: pre-wrap;
}
    /* Button styles */
    #toggle-theme {
      position: fixed;
      top: 10px;
      right: 10px;
      background-color: #FAD439; /* Green color */
      border: none;
      color: white;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      transition: background-color 0.3s, transform 0.3s;
    }

    #toggle-theme:hover {
      background-color: #FAD439; /* Darker green on hover */
      transform: scale(1.05);
    }
  </style>
</head>
<body class="light-mode">
  <div id="app"></div>

  <script>
    window.$docsify = {
      name: 'HAPPYLUCK',
      repo: ''
    };

    const currentTheme = localStorage.getItem('theme');
    if (currentTheme) {
      document.body.classList.toggle('dark-mode', currentTheme === 'dark');
      document.body.classList.toggle('light-mode', currentTheme === 'light');
    }

    document.getElementById('toggle-theme').addEventListener('click', () => {
      const isDarkMode = document.body.classList.toggle('dark-mode');
      document.body.classList.toggle('light-mode', !isDarkMode);

      localStorage.setItem('theme', isDarkMode ? 'dark' : 'light');
    });
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
</body>
</html>
